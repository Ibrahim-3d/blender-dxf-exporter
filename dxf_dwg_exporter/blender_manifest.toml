schema_version = "1.0.0"

id      = "dxf_dwg_exporter"
version = "1.1.0"
name    = "DXF / DWG Exporter — Curves & Grease Pencil"
tagline = "Export Blender curves and grease pencil objects to AutoCAD DXF or DWG"

maintainer = "Ibrahim-3d"
type       = "add-on"
license    = ["SPDX:GPL-3.0-or-later"]
website    = "https://github.com/Ibrahim-3d/blender-dxf-exporter"

blender_version_min = "3.6.0"

tags = ["Import-Export", "Grease Pencil", "Curve"]

[permissions]
files = "Write DXF/DWG files to disk and run LibreDWG's dxf2dwg converter"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
